name: CI

on:
  push:
    branches: [main, bootstrap]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to an upstream release rather than installed from apt. The
      # runner image's shellcheck floats with the image (ubuntu-latest ships
      # 0.9.0 today), which makes a lint result depend on when the job ran
      # rather than on what the code says. The versions genuinely disagree:
      # 0.9.0's SC2317 fires on the indirectly-invoked exit() shadow in
      # lib/module.sh that 0.11.0 correctly stays quiet about. Bumping this
      # deliberately keeps any new finding attached to a reviewable commit.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          url=https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz
          curl -fsSL "$url" -o /tmp/shellcheck.tar.xz
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" \
            /usr/local/bin/shellcheck
          shellcheck --version
      - name: Shellcheck the engine and all module setup scripts
        run: |
          # bootstrap.sh and lib/*.sh are designed to be sourced together as
          # one unit, so they must be analysed as the set they actually are.
          # Linting bootstrap.sh alone makes shellcheck blind to the seven
          # libraries it sources (SC1091) and to the lib/ consumers of
          # ASSUME_YES and MODULE_DIR (SC2034) — both false positives that
          # only appear when the file is checked in isolation.
          shellcheck -x bootstrap.sh lib/*.sh
          # Modules are sourced with the engine's helpers already defined,
          # so tell shellcheck not to flag those as undefined.
          for f in modules/*/setup.sh modules/*/prompts.sh; do
            [ -e "$f" ] || continue
            shellcheck -x -e SC1091 "$f"
          done
          shellcheck tests/container-smoke.sh
      - name: Check fish syntax where fish files are committed
        run: |
          sudo apt-get update && sudo apt-get install -y fish
          for f in $(find dotfiles -name '*.fish'); do
            fish -n "$f" || exit 1
          done

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run unit tests and the dry run over every module
        run: bats tests/

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the container integration and idempotency test
        run: ./tests/container-smoke.sh ubuntu:26.04
